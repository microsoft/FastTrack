/* ==========================================================================
   Agent 365 Enablement Checklist: styles (part 1)
   Tokens, base, shell, sidebar, dashboard components
   ========================================================================== */
:root {
  color-scheme: light;
  --font: "Inter Variable", Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --shell: #dcdce2;
  --panel: #ffffff;
  --bezel: #f4f4f7;
  --bezel-line: #e5e5ea;
  --surface: #ffffff;
  --soft: #f6f6f9;
  --soft-2: #ededf1;
  --hover: #f7f7fa;
  --line: #e7e7ec;
  --line-strong: #d5d5dc;
  --ink: #111114;
  --ink-2: #36363d;
  --muted: #5a5a65;
  --faint: #686873;
  --hairline: #b7b7c0;
  --on-ink: #ffffff;
  --ink-hover: #2a2a30;

  --green: #0f7544; --green-bg: #e8f5ee; --green-line: #c3e4d1;
  --amber: #9a5700; --amber-bg: #fcf3dc; --amber-line: #efd9a0;
  --red: #bf2a1f; --red-bg: #fdeceb; --red-line: #f4c6c1;
  --blue: #2150c8; --blue-bg: #eaf0fe; --blue-line: #c8d7fa;
  --violet: #5b49c4; --violet-bg: #efecfc;

  --mark-done: #131316;
  --mark-doing: #dc9a12;
  --mark-blocked: #d23b2f;
  --mark-todo: #dcdce2;
  --sq-done: #cbcbd3;
  --sq-todo-line: #cfcfd7;

  --shadow-panel: 0 0 0 1px rgba(17, 17, 28, .05), 0 30px 60px -30px rgba(17, 17, 40, .3);
  --shadow-sm: 0 1px 2px rgba(17, 17, 28, .06);
  --shadow-md: 0 12px 32px -10px rgba(17, 17, 28, .28), 0 0 0 1px rgba(17, 17, 28, .06);
  --ring: 0 0 0 3px rgba(33, 80, 200, .32);
  --radius: 14px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --shell: #0b0b0d;
  --panel: #151518;
  --bezel: #1a1a1f;
  --bezel-line: #26262d;
  --surface: #1b1b20;
  --soft: #212127;
  --soft-2: #2a2a31;
  --hover: #202026;
  --line: #2b2b33;
  --line-strong: #3b3b45;
  --ink: #f4f4f7;
  --ink-2: #d5d5dd;
  --muted: #a3a3ae;
  --faint: #9a9aa6;
  --hairline: #55555f;
  --on-ink: #111114;
  --ink-hover: #d9d9df;

  --green: #5fd49a; --green-bg: #11291d; --green-line: #1f4b36;
  --amber: #f0b64a; --amber-bg: #2b2310; --amber-line: #55421a;
  --red: #ff7d70; --red-bg: #341715; --red-line: #61292a;
  --blue: #86aeff; --blue-bg: #15213f; --blue-line: #28407a;
  --violet: #b0a3ff; --violet-bg: #221d41;

  --mark-done: #f4f4f7;
  --mark-doing: #e3a521;
  --mark-blocked: #f0594b;
  --mark-todo: #35353e;
  --sq-done: #4c4c57;
  --sq-todo-line: #4a4a54;

  --shadow-panel: 0 0 0 1px rgba(255, 255, 255, .05), 0 30px 60px -30px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 12px 32px -10px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .07);
  --ring: 0 0 0 3px rgba(134, 174, 255, .4);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--shell); color: var(--ink);
  font: 400 14.5px/1.5 var(--font); font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
svg { display: block; flex: none; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 16px; top: -60px; z-index: 100; background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 12px; text-decoration: none; transition: top .15s; }
.skip:focus { top: 16px; }
[hidden] { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: 100vh; padding: 12px; gap: 12px; transition: grid-template-columns .2s ease; }
.app.collapsed { grid-template-columns: 76px minmax(0, 1fr); }
.panel {
  background: var(--panel); border-radius: 30px; box-shadow: var(--shadow-panel);
  min-width: 0; min-height: calc(100vh - 24px); padding: 22px 30px 44px; position: relative;
}
.panel:focus { outline: none; }
.scrim { display: none; }

/* ---------- Sidebar ---------- */
.sidebar { position: sticky; top: 12px; align-self: start; height: calc(100vh - 24px); display: flex; flex-direction: column; min-height: 0; padding: 10px 4px 0 6px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; }
.brand-mark { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.brand-mark img { width: 34px; height: 34px; display: block; }
.brand-text { min-width: 0; flex: 1; line-height: 1.2; }
.brand-name { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
.brand-sub { font-size: 12px; line-height: 1.3; color: var(--muted); margin-top: 2px; }
.collapse-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); box-shadow: var(--shadow-sm); flex: none; }
.collapse-btn:hover { background: var(--hover); }

.plan-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
.plan-card:hover { border-color: var(--line-strong); }
.plan-avatar { width: 40px; height: 40px; border-radius: 12px; background: #1c2540; color: #fff; display: grid; place-items: center; font: 650 12.5px var(--mono); letter-spacing: .02em; flex: none; }
.plan-text { min-width: 0; flex: 1; line-height: 1.25; }
.plan-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-edit { color: var(--faint); }

.search-btn { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); box-shadow: var(--shadow-sm); text-align: left; margin-bottom: 4px; }
.search-btn:hover { border-color: var(--line-strong); }
.search-btn span { flex: 1; }
.kbd { font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--soft); color: var(--muted); white-space: nowrap; }

.side-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 0 8px; margin: 0 -4px; padding-inline: 4px; scrollbar-width: thin; }
.nav-label { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 18px 12px 8px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 12px; border: 0; background: transparent; border-radius: 13px; font-size: 14.5px; color: var(--ink-2); text-align: left; text-decoration: none; position: relative; }
.nav-item:hover { background: rgba(255, 255, 255, .55); }
[data-theme="dark"] .nav-item:hover { background: rgba(255, 255, 255, .05); }
.nav-item.active { background: var(--surface); color: var(--ink); font-weight: 560; box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
.nav-item .nav-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .nav-ico { color: var(--muted); }
.nav-item.active .nav-ico { color: var(--ink); }
.nav-count { font: 500 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-step { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; }
.nav-step.ok { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
.nav-badge { font: 600 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--red); background: var(--red-bg); border: 1px solid var(--red-line); border-radius: 7px; padding: 4px 6px; }
.nav-off .nav-ico { opacity: .55; }
.nav-off .nav-text, .nav-off .nav-count { color: var(--muted); }
.nav-label.nav-sub { padding-top: 12px; }

.side-foot { padding: 8px 0 6px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.side-foot > * { min-width: 0; } /* keep Help and links, the save status, and long names inside the sidebar */
.status-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
.status-card .row { display: flex; align-items: center; gap: 9px; font-weight: 560; font-size: 14px; }
.status-card p { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: #1fa463; box-shadow: 0 0 0 3px rgba(31, 164, 99, .18); flex: none; }
.pulse.warn { background: #d99a14; box-shadow: 0 0 0 3px rgba(217, 154, 20, .2); }
.user-row { display: flex; align-items: center; gap: 12px; padding: 6px 6px 8px; }
.user-row .av { width: 40px; height: 40px; font-size: 12.5px; }
.user-row .who { flex: 1; min-width: 0; line-height: 1.25; }
.user-row .who b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-row .who span { font-size: 12.5px; color: var(--muted); }
.app.collapsed .brand-text, .app.collapsed .plan-text, .app.collapsed .plan-edit, .app.collapsed .search-btn span, .app.collapsed .search-btn .kbd,
.app.collapsed .nav-label, .app.collapsed .nav-text, .app.collapsed .nav-count, .app.collapsed .nav-step, .app.collapsed .nav-badge, .app.collapsed .status-card, .app.collapsed .user-row .who, .app.collapsed .user-row .more { display: none; }
.app.collapsed .brand { flex-direction: column; }
.app.collapsed .plan-card, .app.collapsed .search-btn { justify-content: center; padding: 0; height: 44px; }
.app.collapsed .nav-item { justify-content: center; padding: 0; }
.app.collapsed .nav-item .ring-mini { margin: 0; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; min-height: 42px; }
.menu-btn { display: none; }
.crumb { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 15px; min-width: 0; }
.crumb svg { color: var(--muted); }
.crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--ink); text-decoration: underline; }
.crumb .sep { color: var(--hairline); }
.spacer { flex: 1; }
.clock { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { position: relative; width: 42px; height: 42px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-sm); }
.icon-btn:hover { background: var(--hover); }
.icon-btn .dot-alert { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: #e5372b; border: 2px solid var(--surface); }

/* ---------- Demo banner ---------- */
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--violet-bg); color: var(--violet); border: 1px solid var(--blue-line); border-radius: 16px; padding: 10px 14px; margin: -8px 0 22px; font-size: 14px; }
.banner b { font-weight: 600; }
.banner .btn { margin-left: auto; }

/* ---------- Hero ---------- */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; margin-bottom: 26px; }
.hero-text { min-width: 0; flex: 1 1 520px; }
.hero h1 { font-size: 46px; line-height: 1.04; letter-spacing: -.04em; font-weight: 600; margin-bottom: 12px; }
.lede { color: var(--ink-2); font-size: 17px; line-height: 1.5; max-width: 74ch; }
.lede strong { color: var(--ink); font-weight: 650; }
.hero-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 44px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 14.5px; font-weight: 520; white-space: nowrap; box-shadow: var(--shadow-sm); text-decoration: none; transition: background .15s, border-color .15s, transform .06s; }
.btn:hover { background: var(--hover); border-color: var(--hairline); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 1px 2px rgba(0, 0, 0, .25); }
.btn-primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn-amber { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber); }
.btn-amber:hover { background: var(--amber-bg); filter: brightness(.97); }
.btn-blue { background: var(--blue-bg); border-color: var(--blue-line); color: var(--blue); }
.btn-blue:hover { background: var(--blue-bg); filter: brightness(.97); }
.btn-danger { color: var(--red); }
.btn-sm { height: 36px; padding: 0 13px; border-radius: 11px; font-size: 13.5px; gap: 7px; }
.btn-ghost { box-shadow: none; background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--soft); border-color: var(--line); }
.btn.icon { width: 44px; padding: 0; }
.btn.icon.btn-sm { width: 36px; }
.select-btn { padding-right: 14px; }

/* ---------- Bezel cards ---------- */
.bezel { background: var(--bezel); border: 1px solid var(--bezel-line); border-radius: 30px; padding: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; min-width: 0; }
.eyebrow { font: 600 11.5px/1.2 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.eyebrow.accent { color: var(--blue); display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); }

/* ---------- KPI ---------- */
.kpi { display: grid; grid-template-columns: minmax(230px, 310px) minmax(0, 1fr); }
.kpi-main { padding: 28px 32px 26px; border-right: 1px solid var(--line); }
.kpi-num { font-size: 84px; line-height: .95; font-weight: 400; letter-spacing: -.055em; font-variant-numeric: tabular-nums; margin: 18px 0 18px; display: flex; align-items: baseline; }
.kpi-num small { font-size: 40px; color: var(--faint); letter-spacing: -.02em; margin-left: 3px; font-weight: 400; }
.kpi-delta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14.5px; flex-wrap: wrap; }
.kpi-side { padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.stat b { display: block; font-size: 38px; line-height: 1.1; font-weight: 400; letter-spacing: -.035em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.stat.doing b { color: var(--amber); }
.stat.blocked b { color: var(--red); }
.stat.todo b { color: var(--faint); }
.ticks { display: flex; align-items: stretch; height: 48px; width: 100%; }
.tick { flex: 1 1 0; min-width: 2px; position: relative; }
.tick::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: max(2px, min(4px, 46%)); transform: translateX(-50%); background: var(--c); border-radius: 1.5px; }
.t-done { --c: var(--mark-done); } .t-doing { --c: var(--mark-doing); } .t-blocked { --c: var(--mark-blocked); } .t-todo { --c: var(--mark-todo); }
.anim .tick::before { animation: tickIn .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 7ms); transform-origin: bottom; }
@keyframes tickIn { from { transform: translateX(-50%) scaleY(.15); opacity: 0; } to { transform: translateX(-50%) scaleY(1); opacity: 1; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.legend .it { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 3px; height: 14px; border-radius: 1.5px; background: var(--c); }
.legend .note { margin-left: auto; color: var(--muted); }

/* ---------- Chips, rings, avatars ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; font: 600 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; border: 1px solid var(--line); background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip-green { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
.chip-amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-line); }
.chip-red { color: var(--red); background: var(--red-bg); border-color: var(--red-line); }
.chip-blue { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-line); }

.av + .av { margin-left: -8px; }
.av-0 { --av-bg: #e8e6fb; --av-fg: #4a3fb0; } .av-1 { --av-bg: #e0ecfd; --av-fg: #1f4aa8; } .av-2 { --av-bg: #dff2e6; --av-fg: #176b3f; }
.av-3 { --av-bg: #fbecd0; --av-fg: #8a5200; } .av-4 { --av-bg: #fbe2ea; --av-fg: #a3274e; } .av-5 { --av-bg: #e9e9ee; --av-fg: #44444c; }
[data-theme="dark"] .av-0 { --av-bg: #2a2552; --av-fg: #c7beff; } [data-theme="dark"] .av-1 { --av-bg: #172a52; --av-fg: #a9c6ff; }
[data-theme="dark"] .av-2 { --av-bg: #14342a; --av-fg: #8fe3b9; } [data-theme="dark"] .av-3 { --av-bg: #38290c; --av-fg: #f3c36a; }

.avs { display: inline-flex; align-items: center; }

/* ---------- Dashboard grid ---------- */
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(340px, 1fr); gap: 22px; margin-top: 22px; align-items: start; }
.col-side { display: grid; gap: 22px; }

.ws-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; background: var(--soft-2); border-radius: 16px; gap: 2px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 8px 15px; border-radius: 12px; font-size: 14.5px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 560; box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }

.sort { position: relative; }

.sort > svg { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }

.ws-list { display: flex; flex-direction: column; }
.ws-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto auto 96px; align-items: center; gap: 14px; width: 100%; padding: 16px 12px; background: transparent; border: 0; border-top: 1px solid var(--line); text-align: left; border-radius: 0; }

.ws-row .sub { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-row .left { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.ws-row .when b { display: block; font-weight: 560; font-size: 15px; font-variant-numeric: tabular-nums; }
.ws-row .when span { font-size: 13.5px; color: var(--muted); }
.ws-open { border: 1px solid var(--line); border-radius: 24px; padding: 20px 20px 18px; margin: 0 0 8px; background: var(--surface); box-shadow: var(--shadow-sm); }
.ws-top { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; }
.ws-top .nm { font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.ws-top .sub { color: var(--ink-2); font-size: 15px; margin-top: 1px; }
.ws-top .when { text-align: right; line-height: 1.3; }
.ws-top .when b { display: block; font-size: 16px; font-weight: 600; }
.ws-top .when .rel { font-size: 14px; }
.rel.alert { color: var(--red); font-weight: 560; } .rel.soon { color: var(--amber); font-weight: 560; } .rel { color: var(--muted); }
.ticks.thin { height: 18px; margin: 18px 0 20px; opacity: .95; }
.ticks.thin .tick::before { width: max(1.5px, min(2px, 40%)); }
.ws-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .92fr) minmax(0, 1.2fr); gap: 24px; align-items: start; }
.col-label { font: 600 11.5px/1.2 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.open-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; margin-bottom: 14px; }
.open-item .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 8px; background: var(--mark-todo); }
.open-item .dot.doing { background: var(--mark-doing); } .open-item .dot.blocked { background: var(--mark-blocked); } .open-item .dot.req { background: var(--mark-blocked); }
.open-item a, .open-item .t { font-weight: 520; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.35; }

.open-item .s { color: var(--muted); font-size: 13.5px; }
.bars .bar-row { display: grid; grid-template-columns: minmax(78px, auto) 1fr 40px; gap: 12px; align-items: center; margin-bottom: 14px; font-size: 14.5px; }

.bar-row .bar i.amber { background: var(--mark-doing); } .bar-row .bar i.red { background: var(--mark-blocked); }
.bar-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bars p.note { color: var(--muted); font-size: 14px; margin-bottom: 14px; line-height: 1.45; }
.callout { background: var(--soft); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; color: var(--ink-2); }
.callout.red { background: var(--red-bg); border-color: var(--red-line); color: var(--red); }
.callout.amber { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber); }
.callout.green { background: var(--green-bg); border-color: var(--green-line); color: var(--green); }
.callout h3 { display: flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 600; margin-bottom: 10px; }

.callout .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid currentColor; border-top-color: color-mix(in srgb, currentColor 22%, transparent); font-size: 14px; }

.ws-actions { display: flex; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.ws-actions .avs { margin-left: auto; }
.ws-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 18px 12px 2px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14.5px; }
.ws-foot a, .ws-foot button { color: var(--ink); font-weight: 520; background: none; border: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 0; }
.ws-foot a:hover, .ws-foot button:hover { text-decoration: underline; }

/* ---------- Matrix and side cards ---------- */
.side-card { padding: 22px 24px; }
.side-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }

.mx-row { padding: 14px 0 4px; }
.mx-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14.5px; }
.mx-top .r { display: inline-flex; gap: 12px; align-items: baseline; font-variant-numeric: tabular-nums; }
.mx-top .bad { color: var(--red); font-weight: 520; } .mx-top .warn { color: var(--amber); font-weight: 520; }
.mx-top .tot { color: var(--ink-2); }
.mx-sq { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.sq { width: 13px; height: 13px; border-radius: 3.5px; background: var(--sq-done); border: 0; padding: 0; display: block; }
.sq.todo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--sq-todo-line); }
.sq.doing { background: var(--mark-doing); } .sq.blocked { background: var(--mark-blocked); } .sq.na { background: transparent; box-shadow: inset 0 0 0 1.5px var(--sq-todo-line); opacity: .5; background-image: linear-gradient(135deg, transparent 45%, var(--sq-todo-line) 45%, var(--sq-todo-line) 55%, transparent 55%); }
a.sq:hover, button.sq:hover { transform: scale(1.25); }
.mx-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font: 500 11.5px var(--mono); color: var(--muted); letter-spacing: .02em; }
.mx-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mx-legend .sq { width: 10px; height: 10px; border-radius: 3px; }

.next-card { padding: 22px 24px 20px; }
.next-item { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; text-decoration: none; }
.next-item:first-of-type { border-top: 0; padding-top: 10px; }
.next-item:hover .t { text-decoration: underline; }
.badge { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font: 650 12.5px var(--mono); letter-spacing: .02em; background: var(--soft-2); color: var(--ink-2); }
.badge.red { background: var(--red-bg); color: var(--red); } .badge.amber { background: var(--amber-bg); color: var(--amber); } .badge.green { background: var(--green-bg); color: var(--green); }
.next-item .t { font-size: 15.5px; font-weight: 520; line-height: 1.3; }
.next-item .s { color: var(--muted); font-size: 13.5px; margin-top: 2px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-item .r { text-align: right; line-height: 1.35; font-size: 13.5px; color: var(--muted); white-space: nowrap; }

.next-actions { display: flex; gap: 10px; margin-top: 12px; }

.cov-card { padding: 22px 24px; }
.meter { margin-top: 16px; }
.meter .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; margin-bottom: 8px; }
.meter .top span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.meter .track { height: 8px; background: var(--soft-2); border-radius: 999px; overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .5s cubic-bezier(.2, .7, .2, 1); }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.empty .empty-title { color: var(--ink); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.empty p { font-size: 14.5px; margin-bottom: 14px; }
.cov-card .empty { text-align: left; padding: 8px 0 0; }
.cov-card .empty p { margin-bottom: 12px; }
.cov-card .empty .empty-title { margin-bottom: 6px; }

/* ==========================================================================
   Agent 365 Enablement Checklist: styles (part 2)
   Forms, task rows, pages, overlays, print, responsive
   ========================================================================== */

/* ---------- Form controls ---------- */
.field { height: 40px; min-width: 0; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 14px; transition: border-color .15s, box-shadow .15s; }
.field::placeholder { color: var(--faint); }
.field:hover { border-color: var(--hairline); }
.field:focus { outline: none; border-color: var(--blue); box-shadow: var(--ring); }
textarea.field { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; width: 100%; }
.field-sm { height: 34px; border-radius: 10px; font-size: 13.5px; padding: 0 10px; }
input[type="date"].field { font-variant-numeric: tabular-nums; }
.select { position: relative; display: inline-block; }
.select select { appearance: none; -webkit-appearance: none; height: 40px; padding: 0 34px 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 14px; max-width: 100%; }
.select select:hover { border-color: var(--hairline); }
.select select:focus { outline: none; border-color: var(--blue); box-shadow: var(--ring); }
.select svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
.select.sm select { height: 34px; border-radius: 10px; font-size: 13.5px; padding-right: 30px; }
.search-field { position: relative; flex: 1 1 260px; min-width: 200px; }
.search-field svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-field .field { width: 100%; padding-left: 38px; }
.toggle { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-2); user-select: none; cursor: pointer; }
.toggle input { width: 17px; height: 17px; accent-color: var(--ink); }
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--soft-2); padding: 0; flex: none; transition: background .15s, border-color .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .18s cubic-bezier(.3, .7, .3, 1); }
.switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:disabled { opacity: .5; cursor: not-allowed; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 14px; }
.toolbar .grow { flex: 1; }
.count-note { color: var(--muted); font-size: 14px; margin-left: auto; font-variant-numeric: tabular-nums; }

/* ---------- Page header (workstream / pages) ---------- */
.page-head { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; align-items: start; margin-bottom: 22px; }
.page-head h1 { font-size: 38px; line-height: 1.08; letter-spacing: -.035em; font-weight: 600; margin: 10px 0 14px; }
.page-head .lede { font-size: 16.5px; }
.page-head .eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl-card { padding: 18px 20px; display: grid; gap: 14px; }
.ctl-top { display: flex; align-items: center; gap: 16px; }
.ctl-top .big { font-size: 40px; font-weight: 400; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.ctl-top .big small { font-size: 20px; color: var(--faint); margin-left: 2px; }

.ctl-row { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 12px; align-items: center; }
.ctl-row > label, .ctl-row > .lbl { font-size: 13.5px; color: var(--muted); }
.ctl-row .field { width: 100%; }
.mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.mini-stats div { font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.mini-stats b { display: block; font: 500 22px/1.2 var(--font); letter-spacing: -.02em; color: var(--ink); margin-top: 3px; text-transform: none; }
.mini-stats .doing b { color: var(--amber); } .mini-stats .blocked b { color: var(--red); }
.tip { display: flex; gap: 12px; align-items: flex-start; background: var(--blue-bg); border: 1px solid var(--blue-line); color: var(--ink-2); border-radius: 16px; padding: 13px 16px; margin: 0 0 18px; font-size: 14.5px; }
.tip svg { color: var(--blue); margin-top: 2px; }
.off-note { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--soft); border: 1px dashed var(--line-strong); border-radius: 16px; padding: 12px 16px; margin-bottom: 18px; color: var(--ink-2); }
.off-note .btn { margin-left: auto; }

/* ---------- Task list ---------- */
.task-list { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); overflow: hidden; }
.phase-head { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--soft); border-top: 1px solid var(--line); }
.phase-head:first-child { border-top: 0; }
.phase-head h2 { font: 600 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.phase-head .blurb { color: var(--muted); font-size: 13.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase-head .ph-count { font: 500 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.phase-head .mini-bar { width: 64px; height: 4px; border-radius: 99px; background: var(--soft-2); overflow: hidden; }
.phase-head .mini-bar i { display: block; height: 100%; background: var(--ink); }

.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; padding: 15px 20px; border-top: 1px solid var(--line); background: var(--surface); }
.phase-head + .task { border-top: 1px solid var(--line); }
.task:hover { background: var(--hover); }
.task.is-open { background: var(--hover); }
.task[data-status="done"] .t-title { color: var(--muted); }
.task[data-status="na"] .t-title { color: var(--muted); }
.task[data-status="done"] .t-title .txt { text-decoration: line-through; text-decoration-color: var(--hairline); }
.check { width: 24px; height: 24px; margin-top: 1px; border-radius: 8px; border: 1.5px solid var(--hairline); background: var(--surface); display: grid; place-items: center; color: transparent; padding: 0; transition: background .12s, border-color .12s; }
.check:hover { border-color: var(--ink); }
.task[data-status="done"] .check { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.task[data-status="doing"] .check { border-color: var(--mark-doing); background: conic-gradient(var(--mark-doing) 0 50%, transparent 50% 100%); }
.task[data-status="blocked"] .check { border-color: var(--mark-blocked); background: var(--red-bg); color: var(--mark-blocked); }
.task[data-status="na"] .check { border-style: dashed; opacity: .6; }
.task-main { min-width: 0; }
.t-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.t-title .txt { font-size: 15.5px; font-weight: 540; line-height: 1.35; letter-spacing: -.005em; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.t-title .txt:hover { text-decoration: underline; text-decoration-color: var(--hairline); }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 5px; color: var(--muted); font-size: 13px; }
.task-meta .id { font: 500 12px var(--mono); letter-spacing: .02em; color: var(--ink-2); }
.task-meta .sep { color: var(--hairline); }
.task-meta .req { color: var(--muted); }
.task-ctl { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.task-ctl .owner { width: 148px; } .task-ctl .due { width: 140px; }
.status-select { position: relative; display: inline-flex; align-items: center; }
.status-select .sdot { position: absolute; left: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--mark-todo); pointer-events: none; z-index: 1; }
.status-select select { appearance: none; height: 34px; padding: 0 30px 0 27px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13.5px; font-weight: 500; min-width: 140px; }
.status-select select:focus { outline: none; border-color: var(--blue); box-shadow: var(--ring); }
.status-select svg { position: absolute; right: 10px; pointer-events: none; color: var(--muted); }
.status-select[data-s="doing"] .sdot { background: var(--mark-doing); } .status-select[data-s="blocked"] .sdot { background: var(--mark-blocked); }
.status-select[data-s="done"] .sdot { background: var(--green); } .status-select[data-s="na"] .sdot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hairline); }

  /* ---------- Checklist workbook ---------- */
  var STATUS_LIST = ["Not started", "In progress", "Blocked", "Completed", "Not applicable"];

    var name = base, i = 2;

    used[name.toLowerCase()] = 1;

  function buildChecklist(snap) {
    var when = snap.when ? new Date(snap.when) : new Date();
    var used = { dashboard: 1, about: 1 };
    var wsList = snap.workstreams.map(function (w) { return { w: w, sheetName: sheetName(w.name, used) }; });
    var sheets = [];

    /* Per-workstream sheets first so the dashboard can reference their ranges */
    var TASK_COLS = [
      ["ID", 9], ["Stage", 12], ["Role", 24], ["Task", 46], ["Priority", 12], ["Pillar", 12], ["Requires", 24], ["Description", 62],
      ["Done when", 42], ["Where", 38], ["More info", 22], ["Also see", 22], ["Owner", 20], ["Due date", 13], ["Status", 15], ["Notes", 36], ["FastTrack guidance", 14], ["Features", 44]
    ];
    var FIRST_COL = 2; // column B
    var statusCol = FIRST_COL + 14; // Status
    var ranges = {};

    wsList.forEach(function (it, idx) {
      var w = it.w, sh = new Sheet(it.sheetName, { tab: w.on ? tabColor(w.area) : "FF9B9BA6", freeze: { row: 5 } });
      var lastCol = FIRST_COL + TASK_COLS.length - 1;
      sh.cols[1] = 2;
      TASK_COLS.forEach(function (c, i) { sh.cols[FIRST_COL + i] = c[1]; });
      sh.set(1, 1, S(w.title, "title")); sh.merge(1, 1, 1, lastCol); sh.height(1, 32);
      sh.set(2, 1, S(w.why, "muted")); sh.merge(2, 1, 2, lastCol); sh.height(2, 36);
      var n = w.tasks.length, r0 = 5, r1 = r0 + n - 1;
      var sc = colName(statusCol), rng = q(sh.name) + "!$" + sc + "$" + r0 + ":$" + sc + "$" + r1;
      var done = w.tasks.filter(function (t) { return t.status === "Completed"; }).length;
      var na = w.tasks.filter(function (t) { return t.status === "Not applicable"; }).length;
      sh.set(3, FIRST_COL, S("Progress", "label"));
      /* A workstream with no tasks in the plan gets static values and no ranges. An empty range would be written
         reversed (O5:O4), which spreadsheet apps either reject or read as two rows, so it showed "0 of 2". */
      if (n) sh.set(3, FIRST_COL + 1, F('COUNTIF($' + sc + "$" + r0 + ":$" + sc + "$" + r1 + ',"Completed")&" of "&(ROWS($' + sc + "$" + r0 + ":$" + sc + "$" + r1 + ")-COUNTIF($" + sc + "$" + r0 + ":$" + sc + "$" + r1 + ',"Not applicable"))', done + " of " + (n - na), "label"));
      else sh.set(3, FIRST_COL + 1, S("0 of 0", "label"));

      var offTxt = "Out of scope: not counted in the Dashboard totals. To include it, set Enable to Yes for " + w.name + " on the Dashboard sheet.";
      sh.set(3, FIRST_COL + 2, F('IF(Dashboard!$G$' + (9 + idx) + '="Yes","","' + offTxt.replace(/"/g, '""') + '")', w.on ? "" : offTxt, "label")); sh.merge(3, FIRST_COL + 2, 3, FIRST_COL + 7);
      TASK_COLS.forEach(function (c, i) { sh.set(4, FIRST_COL + i, S(c[0], "th")); });
      sh.height(4, 26);
      w.tasks.forEach(function (t, i) {
        var r = r0 + i, c = FIRST_COL;

        sh.set(r, c++, S(t.phase, "td"));
        sh.set(r, c++, S(t.role, "td"));

function ledeHtml() {
  var m = model(), T = m.totals, win = P.window;
  var upcoming = m.on.filter(function (vw) { var d = vw.golive ? daysFromToday(vw.golive) : null; return vw.status.id !== "done" && d != null && d >= 0 && d <= win; });
  var late = m.on.filter(function (vw) { var d = vw.golive ? daysFromToday(vw.golive) : null; return vw.status.id !== "done" && d != null && d < 0; });
  var anyDates = m.on.some(function (vw) { return vw.golive; });
  var a;
  if (T.open === 0 && T.applicable > 0) return html`Everything in scope is complete. Schedule your first monthly governance review and keep an eye on Message center.`;
  if (upcoming.length) a = html`${plural(upcoming.length, "workstream")} ${upcoming.length === 1 ? "goes" : "go"} live in the next ${win} days.`;
  else if (late.length) a = html`${plural(late.length, "workstream")} ${late.length === 1 ? "has" : "have"} passed ${late.length === 1 ? "its" : "their"} go-live date.`;
  else if (!anyDates) a = html`No go-live dates are set yet.`;
  else a = html`Nothing goes live in the next ${win} days.`;
  var b;
  if (T.unowned > 0) {
    var top = null;
    m.on.forEach(function (vw) { if (vw.c.unowned > 0 && (!top || vw.c.unowned > top.c.unowned)) top = vw; });
    var due = "";
    if (top) {
      var min = null;
      top.tasks.forEach(function (t) { if (t.open && !t.effOwner && t.daysTo != null && (min == null || t.daysTo < min)) min = t.daysTo; });
      if (min != null && min <= win) due = min < 0 ? ", overdue" : ", due " + relDays(min);
    }
    b = html` <strong>${plural(T.unowned, "task")} still ${T.unowned === 1 ? "needs" : "need"} an owner</strong>${top && top.c.unowned < T.unowned ? html`, ${top.c.unowned} of them in ${top.def.name}${due}` : due}.`;
  } else b = html` Every open task has an owner.`;
  var c = T.blocked > 0 ? html` ${plural(T.blocked, "task")} ${T.blocked === 1 ? "is" : "are"} blocked.` : "";
  return html`${a}${b}${c}`;
}

function sortWs(rows) {
  var mode = P.sort;
  return rows.slice().sort(function (a, b) {
    if (mode === "progress") return a.c.pct - b.c.pct || a.def.order - b.def.order;
    if (mode === "order") return a.def.order - b.def.order;
    var ad = a.golive ? dayNum(a.golive) : 1e9, bd = b.golive ? dayNum(b.golive) : 1e9;
    return ad - bd || a.def.order - b.def.order;
  });
}

function whenHtml(vw) {

}

  if (exp && shown.every(function (v) { return v.id !== exp; })) shown = shown.concat(rows.filter(function (v) { return v.id === exp; }));
  var tab = function (id, label, n, alert) { return html`<button role="tab" id="tab-${id}" aria-selected="${String(UI.tab === id)}" data-act="tab" data-tab="${id}">${label} <span class="count${alert ? " alert" : ""}">${n}</span></button>`; };

function rankOpen(t) { return (t.status === "blocked" ? 0 : t.overdue ? 1 : t.pri === "Required" ? 2 : 3) * 10 + PHASE_BY_ID[t.phase].order; }

function wsOpenHtml(vw) {
  var c = vw.c, w = vw.def, st = vw.status;
  var open = vw.tasks.filter(function (t) { return t.open; }).sort(function (a, b) { return rankOpen(a) - rankOpen(b) || a.n - b.n; });
  var pick = open.slice(0, 4);
  var bp = { Required: { n: 0, d: 0, g: 0 }, Recommended: { n: 0, d: 0, g: 0 }, Optional: { n: 0, d: 0, g: 0 } };
  vw.tasks.forEach(function (t) { if (t.status === "na") return; var b = bp[t.pri]; b.n++; if (t.status === "done") b.d++; else if (t.status === "doing") b.g++; });
  var reqLeft = bp.Required.n - bp.Required.d;
  var blockedTask = vw.tasks.filter(function (t) { return t.status === "blocked"; })[0];
  var overdueTask = vw.tasks.filter(function (t) { return t.overdue; }).sort(function (a, b) { return a.daysTo - b.daysTo; })[0];
  var tone = st.id === "risk" ? "red" : st.id === "owner" ? "amber" : st.id === "done" ? "green" : "";
  var title = st.id === "risk" ? "Why this needs you" : st.id === "owner" ? "Why this needs an owner" : st.id === "done" ? "Nicely done" : "Why it matters";
  var body;
  if (st.id === "risk") {
    if (blockedTask) body = html`${blockedTask.title} is blocked${blockedTask.notes ? html`: ${blockedTask.notes}` : "."} ${overdueTask && overdueTask !== blockedTask ? html`Another task is overdue.` : ""}`;
    else if (overdueTask) body = html`${plural(c.overdue, "task")} ${c.overdue === 1 ? "is" : "are"} overdue, the oldest due ${relDays(overdueTask.daysTo)}.`;
    else body = html`Go-live is ${relDays(daysFromToday(vw.golive))} and ${Math.round(c.pct)}% of tasks are done.`;
  }   else if (st.id === "owner") body = html`Nobody is assigned yet. Name an owner so ${plural(c.unowned, "open task")} ${c.unowned === 1 ? "has" : "have"} a person responsible.`;
  else if (st.id === "done") body = html`Every task in this workstream is complete. Revisit it in your monthly governance review.`;
  else body = html`${w.why}`;
  var act2 = c.blocked ? html`<button class="btn btn-amber" data-act="reviewWs" data-id="${vw.id}" data-status="blocked">${ico("alert", 16)}Resolve ${c.blocked} blocked</button>`
    : c.doing ? html`<button class="btn btn-amber" data-act="reviewWs" data-id="${vw.id}" data-status="doing">${ico("check", 16)}Review ${c.doing} in progress</button>`
    : c.unowned ? html`<button class="btn btn-amber" data-act="reviewWs" data-id="${vw.id}" data-owner="none">${ico("user", 16)}Assign ${c.unowned} owners</button>` : "";
  return html`<div class="ws-open" role="region" aria-label="${w.name} details">
    <div class="ws-top">
      ${ringHtml(vw)}
      <div><div class="nm">${w.name} <span class="code">${w.code}</span></div><div class="sub">${w.summary}</div></div>
      ${chip(st.label, st.tone)}
      <div class="when">${vw.golive ? html`<b>${fmtDate(vw.golive)}</b><span class="rel ${st.id === "done" ? "" : daysFromToday(vw.golive) < 0 ? "alert" : daysFromToday(vw.golive) <= 7 ? "soon" : ""}">${st.id === "done" ? "go-live" : relDays(daysFromToday(vw.golive))}</span>` : html`<b>No date</b><span class="rel">Set in Plan</span>`}</div>
    </div>
    ${segBarHtml(vw)}
    <div class="ws-cols">
      <div>
        <div class="col-label">Still open \u00B7 ${c.open}</div>
        ${pick.length ? pick.map(function (t) {
          return html`<div class="open-item"><span class="dot ${t.status === "blocked" ? "blocked" : t.status === "doing" ? "doing" : t.pri === "Required" ? "req" : ""}"></span><div><button class="t link-btn" data-act="focusTask" data-key="${t.key}">${t.title}</button><div class="s">${t.role}${t.effDue ? " \u00B7 due " + fmtDate(t.effDue) : ""}</div></div></div>`;
        }) : html`<p class="muted">Nothing left to do here.</p>`}
        ${open.length > 4 ? html`<a href="#/w/${vw.id}" class="muted" style="font-size:13.5px">and ${open.length - 4} more</a>` : ""}
      </div>
      <div class="bars">
        <div class="col-label">By priority</div>
        <p class="note">${reqLeft ? plural(reqLeft, "required task") + " " + (reqLeft === 1 ? "gates" : "gate") + " go-live." : "All required tasks are done."}</p>
        ${["Required", "Recommended", "Optional"].map(function (k) {
          var b = bp[k]; if (!b.n) return html``;
          return html`<div class="bar-row"><div class="top"><span>${k}</span><span class="n">${b.d}/${b.n}</span></div><span class="bar" role="img" aria-label="${k}: ${b.d} of ${b.n} done"><i style="width:${(b.d / b.n * 100).toFixed(1)}%"></i><i class="amber" style="width:${(b.g / b.n * 100).toFixed(1)}%"></i></span></div>`;
        })}
      </div>
      <div class="callout ${tone}">
        <h3>${ico(st.id === "done" ? "check" : st.id === "risk" || st.id === "owner" ? "alert" : "info", 18)}${title}</h3>
        <p>${body}</p>
        <div class="foot"><span>Owner</span><b>${vw.owner || "Unassigned"}</b></div>
      </div>
    </div>
    <div class="ws-actions">
      <a class="btn btn-primary" href="#/w/${vw.id}" data-act="closeNav">Open checklist${ico("arrowUR", 15)}</a>
      ${act2}
      ${avatarsHtml(vw, 4)}
    </div>
  </div>`;
}

function badgeTone(t) { if (t.daysTo == null) return ""; return t.daysTo <= 3 ? "red" : t.daysTo <= 14 ? "amber" : ""; }

function coverageCardHtml() {

      : html`<div class="empty"><h4>Track real coverage</h4><p>Checklist progress shows what you've done. Add your licensed users and agent counts to show how much of your estate is governed.</p><a class="btn btn-sm" href="#/plan">Add numbers</a></div>`}

/* ==========================================================================
   Agent 365 Enablement Checklist: UI part 2
   Task rows, workstream page, all tasks, plan, help, print report
   ========================================================================== */

function distinct(list) { var seen = {}, out = []; list.forEach(function (v) { if (v && !seen[v]) { seen[v] = 1; out.push(v); } }); return out; }

function ownersDatalist() {
  var names = [S.org.lead, S.org.sponsor];
  Object.keys(S.scope).forEach(function (k) { names.push(S.scope[k].owner); });
  Object.keys(S.tasks).forEach(function (k) { names.push(S.tasks[k].owner); });
  return html`<datalist id="owners">${distinct(names).sort().map(function (n) { return html`<option value="${n}"></option>`; })}</datalist>`;
}

/* ---------- Filters and grouping ---------- */
function applyFilters(tasks, f) {
  var toks = f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return tasks.filter(function (t) {
    if (f.pri && t.pri !== f.pri) return false;
    if (f.status && t.status !== f.status) return false;
    if (f.role && t.role !== f.role) return false;
    if (f.phase && t.phase !== f.phase) return false;
    if (f.ws && t.wsId !== f.ws) return false;
    if (f.step && t.step !== +f.step) return false;
    if (f.part && t.part !== f.part) return false;
    if (f.wave && t.wave !== f.wave) return false;
    if (f.pillar && t.pillar !== f.pillar) return false;
    if (f.feat && !(TASK_FEATS[t.key] || []).some(function (x) { return x.f === f.feat; })) return false;
    if (f.team && t.team !== f.team) return false;
    if (f.owner) { if (f.owner === "(none)") { if (t.effOwner) return false; } else if (t.effOwner !== f.owner) return false; }
    if (f.due === "overdue" && !t.overdue) return false;
    if (f.due === "week" && !(t.open && t.daysTo != null && t.daysTo >= 0 && t.daysTo <= 7)) return false;
    if (f.due === "none" && (t.effDue || !t.open)) return false;
    if (f.hideDone && !t.open) return false;
    if (f.hidePreview && t.preview) return false;
    if (f.hideOptional && t.pri === "Optional") return false;
    if (toks.length) {
      var hay = (t.title + " " + t.desc + " " + (t.steps || []).join(" ") + " " + (t.rollback || "") + " " + t.role + " " + t.id + " " + t.req + " " + t.where + " " + t.notes + " " + t.wsName + " " + t.owner + " " + t.done + " " + PILLAR_BY_ID[t.pillar].name + " " + (t.stage ? STAGE_BY_ID[t.stage].name : "") + " " + TEAM_BY_ID[t.team].name).toLowerCase();
      for (var i = 0; i < toks.length; i++) if (hay.indexOf(toks[i]) < 0) return false;
    }
    return true;
  });
}

var STATUS_ORDER = ["blocked", "doing", "todo", "done", "na"];
function dueBucket(t) {
  if (!t.open) return ["z4", "Closed"];
  if (t.daysTo == null) return ["z3", "No due date"];
  if (t.daysTo < 0) return ["a0", "Overdue"];
  if (t.daysTo <= 7) return ["a1", "Due this week"];
  return ["a2", "Later"];
}

function groupTasks(tasks, by) {
  var groups = [], idx = {};
  if (by === "none") return [{ id: "all", title: "", blurb: "", order: 0, tasks: tasks }];
  tasks.forEach(function (t) {
    var id, title, blurb = "", order = 0;
    if (by === "phase") { var p = PHASE_BY_ID[t.phase]; id = p.id; title = p.name; blurb = p.blurb; order = p.order; }
    else if (by === "part") { var pp = PART_BY_ID[t.part]; id = "p" + pp.id; title = "Part " + pp.id + " \u00B7 " + pp.name; blurb = "Steps " + pp.steps.join(", ") + " \u00B7 " + pp.blurb; order = pp.order; }
    else if (by === "wave") { var wv = WAVE_BY_ID[t.wave]; id = "w" + wv.id; title = wv.name + " \u00B7 " + wv.label; blurb = wv.blurb; order = wv.order; }
    else if (by === "status") { id = t.status; title = STATUS_BY_ID[t.status].name; order = STATUS_ORDER.indexOf(t.status); }
    else if (by === "role") { id = t.role; title = t.role; order = 0; }
    else if (by === "pillar") { var pi = PILLAR_BY_ID[t.pillar], ph = pillarPhase(t.pillar); id = "x" + pi.order; title = pi.name; blurb = (ph === "off" ? "Off \u00B7 " : "") + pi.blurb; order = pi.order; }
    else if (by === "stage") { if (t.pillar === "observe") { var sg = STAGE_BY_ID[t.stage]; id = "s" + (sg ? sg.order : 9); title = "Observe \u00B7 " + (sg ? sg.name : "Your own tasks"); blurb = sg ? sg.blurb : ""; order = sg ? sg.order : 3; } else { var po = PILLAR_BY_ID[t.pillar]; id = "x" + po.order; title = po.name; blurb = (pillarOn(t.pillar) ? "" : "Off \u00B7 ") + po.blurb; order = po.id === "foundation" ? -1 : 10 + po.order; } }
    else if (by === "team") { var tm = TEAM_BY_ID[t.team]; id = "t" + tm.order; title = tm.name; blurb = tm.where; order = tm.order; }
    else if (by === "pri") { id = t.pri; title = t.pri; order = PRIORITIES.indexOf(t.pri); }
    else if (by === "step") { var ob = ONB_BY_N[t.step]; id = "s" + (t.step || 99); title = ob ? "Step " + ob.n + ": " + ob.name : "Your own tasks"; blurb = ob ? ob.blurb : ""; order = t.step || 99; }
    else if (by === "owner") { id = t.effOwner || "\u0000"; title = t.effOwner || "Unassigned"; order = t.effOwner ? 1 : 0; }
    else if (by === "due") { var b = dueBucket(t); id = b[0]; title = b[1]; order = 0; }
    else { id = t.wsId; title = t.wsName; blurb = t.wsCode; order = t.ws.order; }
    if (!idx[id]) { idx[id] = { id: id, title: title, blurb: blurb, order: order, tasks: [] }; groups.push(idx[id]); }
    idx[id].tasks.push(t);
  });
  groups.sort(function (a, b) { return a.order - b.order || String(a.id).localeCompare(String(b.id)); });
  return groups;
}

/* ---------- Task row ---------- */
function taskRow(t, ctx) {
  var open = !!UI.open[t.key], did = "d-" + t.key.replace(/[^a-z0-9]/gi, "-");
  var inherit = t.ws && model().byId[t.wsId].owner;
  var sub = [];
  sub.push(html`<span class="id">${t.id}</span>`);
  sub.push(html`<span>${t.role}</span>`);
  if (ctx.showWs) sub.push(html`<span>${t.wsName}</span>`);
  if (t.step && ONB_BY_N[t.step]) sub.push(html`<span>Step ${t.step}</span>`);
  if (t.req) sub.push(html`<span class="req">Requires ${t.req}</span>`);
  var meta = sub.map(function (x, i) { return i ? html`<span class="sep" aria-hidden="true">\u00B7</span>${x}` : x; });
  var lastUpd = t.updated ? "Updated " + agoText(t.updated) : "";
  return html`
  <article class="task${open ? " is-open" : ""}" data-key="${t.key}" data-status="${t.status}">
    <button class="check" role="checkbox" aria-checked="${String(t.status === "done")}" aria-label="Mark complete: ${t.title}" data-act="toggleDone" data-key="${t.key}" data-fk="ck:${t.key}">${t.status === "done" ? ico("check", 15) : ""}</button>
    <div class="task-main">
      <div class="t-title"><button class="txt" data-act="toggleOpen" data-key="${t.key}" aria-expanded="${String(open)}" aria-controls="${did}" data-fk="tt:${t.key}">${t.title}</button>
        ${t.pri !== t.basePri && !t.custom ? html`<span title="${optInBoost(t.platforms) ? "Recommended because an agent type it applies to is turned on in Plan setup" : "Recommended because a feature you chose in Plan setup includes it"}">${priChip(t.pri)}</span>` : priChip(t.pri)}${pillarChip(t)}${t.preview ? html`<span class="chip chip-violet">Preview</span>` : ""}${t.custom ? html`<span class="chip chip-blue">Custom</span>` : ""}${t.pillarOff ? html`<span class="chip chip-gray chip-dashed" title="Turn this pillar on under Plan setup, Pillars, to add its tasks to your plan">Pillar off</span>` : ""}${t.featOff ? html`<span class="chip chip-gray chip-dashed" title="Choose a feature that includes this task under Plan setup, Features, to add it to your plan">Not in chosen features</span>` : ""}${t.platOff ? html`<span class="chip chip-gray chip-dashed" title="Turn on this agent type in Plan setup to include this task">Platform not in scope</span>` : ""}${t.levelOff ? html`<span class="chip chip-gray chip-dashed" title="${t.hidden ? "Add this priority under Plan setup, Plan depth, or set a status to add just this task" : "Kept in your plan because it has a status, owner, or due date"}">Outside plan depth</span>` : ""}</div>
      <div class="task-meta">${meta}</div>
    </div>
    <div class="task-ctl">
      <input class="field field-sm owner" list="owners" maxlength="80" data-f="owner" data-key="${t.key}" value="${t.owner}" placeholder="${inherit || "Owner"}" aria-label="Owner for ${t.title}">
      <input class="field field-sm due${t.due ? "" : " is-empty"}" type="date" data-f="due" data-key="${t.key}" value="${t.due}" aria-label="Due date for ${t.title}">
      <span class="status-select" data-s="${t.status}"><i class="sdot"></i><select data-f="status" data-key="${t.key}" data-fk="st:${t.key}" aria-label="Status for ${t.title}">${STATUSES.map(function (s) { return html`<option value="${s.id}" ${t.status === s.id ? raw("selected") : ""}>${s.name}</option>`; })}</select>${ico("chevD", 14)}</span>
      <button class="expander" data-act="toggleOpen" data-key="${t.key}" aria-label="${open ? "Hide" : "Show"} details" tabindex="-1">${ico("chevD", 18)}</button>
    </div>
    <div class="task-detail" id="${did}" ${open ? "" : raw("hidden")}>
      <div class="dl">
        <div><div class="k">What to do</div><p>${t.desc || "Add your own guidance in the notes."}</p></div>
        ${t.steps && t.steps.length ? html`<div><div class="k">How to</div><ol class="steps">${t.steps.map(function (s) { return html`<li>${s}</li>`; })}</ol></div>` : ""}
        ${t.where ? html`<div><div class="k">Where</div><span class="path">${t.where}</span></div>` : ""}
        <div><div class="k">Pillar and team</div><p>${pillarLine(t)}</p></div>
        ${featHtml(t)}
        ${t.req ? html`<div><div class="k">Requires</div><p>${t.req}</p></div>` : ""}
        ${t.done ? html`<div><div class="k">Done when</div><div class="done-when">${ico("check", 16)}<span>${t.done}</span></div></div>` : ""}
        ${t.rollback ? html`<div><div class="k">Rollback</div><p class="rollback">${t.rollback}</p></div>` : ""}
        ${t.examples && t.examples.length ? t.examples.map(function (ex) { return html`<div><div class="k">Worked example: ${ex.title}</div><ol class="steps">${ex.steps.map(function (s) { return html`<li>${s}</li>`; })}</ol></div>`; }) : ""}
      </div>
      <div class="stack">
        ${t.deep ? html`<div><div class="k">Detailed walkthrough</div><div class="refs"><a href="${guideHref(t.deep)}" target="_blank" rel="noopener noreferrer">${ico("ext", 14)}Customer implementation guide: ${t.deep}</a></div><p class="walk-note">Opens this step in the guide's Detailed view, with screenshots and field-level steps. Where it differs from this checklist, follow this checklist.</p></div>` : ""}
        ${t.links.length ? html`<div><div class="k">References</div><div class="refs">${t.links.map(function (l) { return html`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${ico("ext", 14)}${l[0]}</a>`; })}</div></div>` : ""}
        ${t.ft ? html`<p class="ft-hint">${ico("info", 14)}<span>Eligible customers can get remote guidance for this task from <a href="${FT_URL}" target="_blank" rel="noopener noreferrer">FastTrack</a>.</span></p>` : ""}
        <div><label class="k" for="n-${did}">Notes</label><textarea class="field" id="n-${did}" data-f="notes" data-key="${t.key}" maxlength="2000" placeholder="Add a note, blocker, decision, or evidence link">${t.notes}</textarea></div>
        <div class="foot"><span>${lastUpd}</span>${t.custom ? html`<button class="btn btn-sm btn-danger" data-act="deleteTask" data-key="${t.key}">${ico("trash", 14)}Delete task</button>` : ""}</div>
      </div>
    </div>
  </article>`;
}

function taskGroupsHtml(tasks, f, ctx) {
  if (!tasks.length) return html`<div class="task-list">${emptyState("No tasks match", "Try clearing a filter or searching for a different word.", html`<button class="btn btn-sm" data-act="clearFilters" data-view="${ctx.key}">Clear filters</button>`)}</div>`;
  var groups = groupTasks(tasks, f.group);
  var rowCtx = { showWs: ctx.showWs, showPhase: f.group !== "phase" };
  return html`<div class="task-list">${groups.map(function (g) {
    var done = g.tasks.filter(function (t) { return t.status === "done"; }).length, appl = g.tasks.filter(function (t) { return t.status !== "na"; }).length;
    var head = g.title ? html`<div class="phase-head"><h2>${g.title}</h2><span class="blurb">${g.blurb}</span><span class="mini-bar" aria-hidden="true"><i style="width:${appl ? (done / appl * 100).toFixed(0) : 0}%"></i></span><span class="ph-count">${done}/${appl}</span></div>` : "";
    return html`${head}${g.tasks.map(function (t) { return taskRow(t, rowCtx); })}`;
  })}</div>`;
}

function baseTasks(key) {
  var m = model();
  if (key === "tasks") { var all = []; m.on.forEach(function (vw) { all = all.concat(vw.tasks); }); return all; }
  return m.byId[key.slice(3)].tasks;
}

function hiddenTasks(key) {
  var m = model();
  return key === "tasks" ? m.hidden : m.byId[key.slice(3)].hidden;
}

function activeFilters(f) {
  var a = [];
  if (f.step) a.push("Step " + f.step);

function resultsHtml(key) {

function viewHelp() {
  var linkItems = [
    [L.fasttrack, "What FastTrack covers for Agent 365 enablement."],
    [L.docs, "Official Agent 365 documentation on Microsoft Learn."],
    [L.guide, "Step-by-step portal paths, validation, and sample hunting queries."],
    [L.advisory, "Reference architecture and best practices for identity, governance, security, and operations."],
    [L.costTool, "Estimate agent consumption and licensing costs."],
    [L.playbook, "Roles, cadence, and the Discover, Evaluate, Monitor process for the Observe pillar."],
    [L.adoption, "Adoption materials for champions and leaders."],
    [L.roadmap, "Track upcoming Microsoft 365 changes."]
  ];
  return html`
    ${demoBanner()}
    <header class="hero"><div class="hero-text"><h1>Help and links</h1><p class="lede">A tracker for enabling Microsoft Agent 365, built by Microsoft FastTrack. Tasks are grouped by workstream, with a role, priority, and phase for each.</p></div></header>
    <div class="prose help-doc">
      <h2>How to use it</h2>
      <ol>
        <li><b>Start with Plan setup.</b> Name your rollout, set the deployment lead and go-live date, turn on the agent types you use, turn on the pillars your plan covers (or choose specific features), and choose your plan depth. After that, come back only to change scope or merge backups.</li>
        <li><b>Check the Overview.</b> It's the home page. It shows go-live readiness (Required tasks done) and what needs attention: blocked, overdue, and tasks without an owner. Review it weekly.</li>
        <li><b>Work the tasks.</b> Use All tasks or a workstream, and follow the onboarding order (steps 1 to 11), Required tasks first. Assign owners and dates, update status as work moves, and add notes for blockers and evidence.</li>
        <li><b>Collaborate.</b> Keep one master copy. Teammates work in their own copy of the same file, then use Download a backup and send it to you. In Plan setup, use Merge a backup: changes made in only one copy come across automatically, notes are combined rather than overwritten, and you choose when the same field changed in both.</li>
        <li><b>Share it.</b> Export to Excel or print for steering meetings, or download a backup.</li>
      </ol>
      <h2>How the checklist is organized</h2>
      <table class="ref"><thead><tr><th>Label</th><th>Answers</th><th>Values</th></tr></thead><tbody>
        <tr><td>Onboarding step</td><td>In what order?</td><td>Steps 1 to 11 below. Work through them in order.</td></tr>
        <tr><td>Priority</td><td>How important?</td><td>Required tasks gate go-live. Recommended tasks complete the enterprise baseline. Optional tasks only if they apply.</td></tr>
        <tr><td>Pillar</td><td>What kind of work?</td><td>Foundation, Observe, Govern, or Secure. Turn each on or off under Plan setup, Pillars.</td></tr>
        <tr><td>Feature</td><td>Which capability?</td><td>${FEATURES.length} features across Observe, Govern, and Secure, such as Conditional Access or shadow AI discovery. Choose them under Plan setup, Features, to get a checklist for just those capabilities, or filter All tasks by one.</td></tr>
        <tr><td>Workstream</td><td>Which team?</td><td>Foundations, Admin center, Defender, Entra, Purview, SharePoint, and the rest. Each has an owner and a go-live date.</td></tr>
      </tbody></table>
      <p>The steps match the recommended onboarding order in the FastTrack SME deployment checklist. Its parts map to them as follows: ${PARTS.map(function (p) { return "Part " + p.id + " " + p.name + " is steps " + p.steps.join(", "); }).join("; ")}.</p>
      <h2>Pillars and the Observability Playbook</h2>
      <p>Every task has one pillar, so you can start with Observe without turning off whole workstreams. <b>Observe</b> tasks surface a signal without changing what an agent can do, including audit, report-only, and simulation modes. <b>Govern</b> tasks set ownership, lifecycle, and access decisions. <b>Secure</b> tasks block, enforce, contain, or respond. <b>Foundation</b> tasks are the licenses, roles, scope, and prerequisites every pillar relies on.</p>
      <p>The pillars follow the <a href="${L.playbook[1]}" target="_blank" rel="noopener noreferrer">${L.playbook[0]}</a>. Its process for the Observe pillar has three stages that run continuously, and Observe tasks carry the stage they support, so you can group All tasks by Observe stage.</p>
      <table class="ref"><thead><tr><th>Stage</th><th>What it answers</th></tr></thead><tbody>${STAGES.map(function (x) { return html`<tr><td>${x.name}</td><td>${x.blurb}</td></tr>`; })}</tbody></table>
      <p>The playbook also names the teams that run an observability program. The Team filter maps each task's admin role to one of them: ${TEAMS.map(function (x) { return x.name; }).join(", ")}.</p>
      <p>Use Plan setup, Pillars, to stage your rollout. For example, turn on only Observe to start: your plan keeps the Foundation and Observe tasks and the task count drops to match. Turn on Govern and Secure when you're ready, and their tasks come back with anything you already recorded.</p>
      <h2>Plan by feature</h2>
      <p>Pillars scope a plan by the kind of work. Features scope it by capability, so you can answer "what do we need to do to turn this on?" Choose features under Plan setup, Features. Your plan then holds each chosen feature's tasks, the prerequisite tasks it needs from other pillars and workstreams, and the Foundation tasks every feature relies on: sponsor and scope, licenses, roles, data handling, test users, and release preferences. While features are chosen, pillar switches are paused. Clear the features to plan by pillar again, with your pillar choices intact.</p>
      <p>A chosen feature's Optional tasks count as Recommended. Plan depth and agent types still apply, so a feature for an agent type you don't use adds only its shared tasks, and Plan setup tells you which agent types would add more. A feature that can't work without an agent type or workstream, such as shadow AI discovery, turns it on for you and says so. A task can support several features, and its details list each one. Exports add a Features column so you can filter the workbook the same way.</p>
      <table class="ref feat-ref"><thead><tr><th>Feature</th><th>Pillar</th><th>What it covers</th></tr></thead><tbody>${FEATURES.map(function (f) { return html`<tr><td>${f.name}</td><td>${PILLAR_BY_ID[f.pillar].name}</td><td>${f.blurb}</td></tr>`; })}</tbody></table>
      <h2>Recommended onboarding order</h2>
      <ol>${ONBOARDING.map(function (s) { return html`<li><b>${s.name}.</b> ${s.blurb}</li>`; })}</ol>
      <h2>How each agent gets into Agent 365</h2>
      <table class="ref"><thead><tr><th>Route</th><th>Applies to</th><th>Admin effort</th></tr></thead><tbody>
        <tr><td>Native registration</td><td>Microsoft-built agents, Agent Builder, Copilot Studio, SharePoint agents, and supported Microsoft Foundry agents</td><td>None. The platform registers them.</td></tr>
        <tr><td>Registry sync (preview)</td><td>Agents on Amazon Bedrock, Google Vertex AI, Salesforce Agentforce, Databricks Genie, Anthropic Claude Managed Agents, Oracle Generative AI Agents, and Snowflake Cortex</td><td>A one-time read-only connection per platform. Sync is manual.</td></tr>
        <tr><td>Agent 365 SDK and CLI</td><td>Custom pro-code agents. Partner agents vary by partner.</td><td>Blueprint, identity, telemetry, and tools for each agent.</td></tr>
      </tbody></table>
      <h2>What each onboarding depth gives you</h2>
      <table class="ref"><thead><tr><th>Depth</th><th>What you get</th><th>What it doesn't give you</th></tr></thead><tbody>
        <tr><td>1. Registered</td><td>Inventory, metadata, and the admin actions the platform supports</td><td>No agent identity, Conditional Access, or runtime blocking</td></tr>
        <tr><td>2. Plus telemetry</td><td>Activity evidence in Agent 365, Purview, and Defender</td><td>Telemetry records behavior. It doesn't enforce anything.</td></tr>
        <tr><td>3. Plus an Entra agent identity</td><td>Owners, sponsors, sign-in logs, and eligibility for Conditional Access and identity governance</td><td>Entra policies apply only when the agent signs in with its Entra identity.</td></tr>
        <tr><td>4. Protected</td><td>Defender rules, Purview policies scoped to agents, and Entra and SharePoint controls, each verified</td><td>A policy template alone isn't proof. Verify each control in its owning portal.</td></tr>
      </tbody></table>
      <h2>What onboarded means</h2>
      <table class="ref"><thead><tr><th>Pillar</th><th>Minimum evidence</th><th>Common false positive</th></tr></thead><tbody>
        <tr><td>Observe</td><td>The agent is in the registry with a known owner, source, and status, and its activity is visible where supported.</td><td>It appears in the registry, but no telemetry or interaction evidence exists.</td></tr>
        <tr><td>Govern</td><td>An accountable owner or sponsor exists, access is least privilege, and lifecycle, tool, data, and approval controls are applied.</td><td>A template is attached, but its Entra, Purview, or SharePoint configuration was never completed.</td></tr>
        <tr><td>Secure</td><td>Posture is reviewed, threat detection is on, and a safe test proves the intended block works.</td><td>Telemetry is present, but nothing enforces controls on the agent's actual runtime, tools, or data.</td></tr>
      </tbody></table>
      <h2>Detailed walkthroughs</h2>
      <p>Most tasks link to the matching step of the <a href="${GUIDE_URL}" target="_blank" rel="noopener noreferrer">Agent 365 Customer implementation guide</a> (Detailed view), which has screenshots, field-level steps, and validation for each control. Use this checklist as the plan of record. Where the two differ, follow this checklist, which was reviewed against Microsoft Learn more recently.</p>
      <h2>What the labels mean</h2>
      <div class="def-grid">
        <div class="def"><b>${chip("Required", "gray", "chip-outline")}</b><p>The minimum for a safe pilot and go-live. Start here; these gate go-live.</p></div>
        <div class="def"><b>${chip("Recommended", "gray")}</b><p>Strongly recommended for large enterprises. Complete these before or soon after broad rollout.</p></div>
        <div class="def"><b>${chip("Optional", "gray", "chip-dashed")}</b><p>Extra depth, or tasks for a specific license or preview feature. Add them under Plan, Plan depth.</p></div>
        <div class="def"><b>${chip("Preview", "violet")}</b><p>Relies on a capability that's in preview. Pilot it before you depend on it.</p></div>
      </div>
      <div class="def-grid">
        ${STATUSES.map(function (s) { return html`<div class="def"><b><i class="sdotx" data-s="${s.id}"></i>${s.name}</b><p>${{ todo: "Nothing has started yet.", doing: "Someone is working on it.", blocked: "Stuck on a decision, dependency, or access.", done: "Finished and validated against the Done when criteria.", na: "Doesn't apply. It's excluded from readiness." }[s.id]}</p></div>`; })}
      </div>
      <h3>How readiness is calculated</h3>
      <p>Readiness is completed tasks divided by applicable tasks in your plan. Your plan includes the workstreams in scope, the agent types you use, the pillars you turned on or the features you chose, and the priorities you chose under Plan depth. The dashboard leads with go-live readiness: completed Required tasks out of all Required tasks in your plan. Tasks you've started always count unless their pillar is off, and tasks marked Not applicable never do. Workstream health follows simple rules: <b>At risk</b> means a task is blocked or overdue, or go-live is close and less than half is done. <b>Needs owner</b> means nobody is assigned. <b>On track</b> means work has started with no risk signals.</p>
      <h2>Keyboard shortcuts</h2>
      <div class="kbd-grid"><span><span class="kbd">${/Mac|iPhone|iPad/.test(navigator.platform || "") ? "\u2318 K" : "Ctrl K"}</span> or <span class="kbd">/</span></span><span>Search tasks, workstreams, and actions</span><span><span class="kbd">Esc</span></span><span>Close menus and dialogs</span></div>
      <h2>Your data and privacy</h2>
      <p>This is a single file with no server, sign-in, tracking, or network requests. Your plan is saved in this browser's local storage, separately for each checklist file name, so a renamed copy starts its own plan. Plans saved by other files are listed in Plan setup. Clearing site data removes it, and anyone with access to this browser profile can read it. Download a backup to keep or move your plan, and avoid entering secrets or personal data in notes.</p>
      <h2>Keep learning</h2>
      <ul class="link-list">${linkItems.map(function (x) { return html`<li><a href="${x[0][1]}" target="_blank" rel="noopener noreferrer">${ico("ext", 15)}${x[0][0]}</a><small>${x[1]}</small></li>`; })}</ul>
      <h2>About this checklist</h2>
      <p>${ATTRIBUTION} and shared in the <a href="${REPO_URL}" target="_blank" rel="noopener noreferrer">Microsoft FastTrack open source repository</a> under the MIT License, as a template you can adapt. Version ${CONTENT_VERSION}. Content reviewed ${fmtDate(CONTENT_REVIEWED, true)} against public Microsoft Learn documentation. Product availability, licensing, roles, and portal paths change, so confirm each step in your tenant. <a href="https://github.com/microsoft/FastTrack/issues/new?template=resource-feedback.yml&amp;resource=Agent%20365%20Enablement%20Checklist&amp;title=%5BAgent%20365%20Enablement%20Checklist%5D%20" target="_blank" rel="noopener noreferrer">Report an issue or suggest a change</a>.</p>
      <h2>FastTrack guidance</h2>
      <p>Some task details include a short note that eligible customers can get remote guidance from FastTrack. These notes follow the published <a href="${FT_URL}" target="_blank" rel="noopener noreferrer">FastTrack for Microsoft Agent 365</a> scope. FastTrack guides, and your teams or partner do the hands-on work. A task without the note is still part of a complete rollout. <a href="${FT_ELIGIBILITY_URL}" target="_blank" rel="noopener noreferrer">Check FastTrack eligibility</a>.</p>
      <h2>Disclaimer</h2>
      <p>${DISCLAIMER} Microsoft and Agent 365 are trademarks of the Microsoft group of companies.</p>
    </div>`;
}

  rd.onload = function () {
    var obj; try { obj = JSON.parse(String(rd.result)); } catch (err) { obj = null; }
    if (!obj || obj.app !== APP_ID || !obj.state) { toast("That file isn't an Agent 365 checklist backup."); return; }
    if (fileMode === "merge") { startMerge(obj, f.name); return; }
    confirmDialog({ title: "Replace this plan?", text: "Importing replaces your current plan with the backup from " + (obj.exportedAt ? fmtDate(String(obj.exportedAt).slice(0, 10), true) : "your file") + ". Download a backup first if you want to keep what you have now.", label: "Import backup",
      extra: html`<button class="btn" type="button" data-act="exportJson">${ico("download", 15)}Download current</button>`,
      onConfirm: function () { applyImport(obj); closeDialog(); toast("Backup imported"); } });
  };
  rd.readAsText(f);
});

window.addEventListener("hashchange", function () {
  var had = !!UI.scrollTo;
  closePop(); render();
  if (!had && !(location.hash || "").split("#")[2]) { window.scrollTo(0, 0); var main = $("#main"); if (main) main.focus({ preventScroll: true }); }
});
window.addEventListener("beforeprint", function () { $("#printRoot").innerHTML = printReportHtml().s; });
window.addEventListener("beforeunload", flushSave);
window.addEventListener("pagehide", flushSave);
window.addEventListener("resize", function () { closePop(); applySize(); updateSideFade(); });
document.addEventListener("scroll", function (e) { var t = e.target; if (t && t.classList && t.classList.contains("side-scroll")) updateSideFade(); }, true);
window.addEventListener("storage", function (e) {
  if (e.key !== KEY || DEMO || !e.newValue) return;
  try { REAL = sanitizeState(JSON.parse(e.newValue)); S = REAL; scheduleRender(200); } catch (err) { /* ignore */ }
});
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && lastDay !== todayISO()) render(); });
if (DARK_MQ && DARK_MQ.addEventListener) DARK_MQ.addEventListener("change", function () { if (P.theme === "system") applyTheme(); });
setInterval(function () { var c = $("#clock"); if (c) c.textContent = clockText(); }, 30000);

/* ---------- Boot ---------- */
applyTheme();
applySize();
/* A plan saved from an earlier pre-filled plan in this file gets the update once. The plan as it was is kept in Plan setup. */
var seedNote = "";
if (typeof SEED_UPGRADE_FROM !== "undefined" && SEED_UPGRADE_FROM) {
  var upd = upgradeFromSeed(REAL, SEED_UPGRADE_FROM);
  if (upd) {
    try { localStorage.setItem(KEY + ".preupdate", JSON.stringify(REAL)); localStorage.setItem(KEY + ".preupdate.seed", SEED_UPGRADE_FROM); } catch (e) { /* ignore */ }
    upd.savedAt = Date.now(); REAL = upd; S = REAL; M = null; persist();
    try { localStorage.setItem(KEY + ".seed", seedId()); } catch (e) { /* ignore */ }
    seedNote = "Your plan now includes the latest pre-filled updates. Everything you changed was kept.";
  }
}
if (/[?&]demo(=|&|$)/.test(location.search)) { DEMO = true; S = sampleState(); }
render();
if (seedNote && !DEMO) toast(seedNote);
if (!DEMO && !S.org.customer && !Object.keys(S.tasks).length && savedPlans().length) toast("This file keeps its own plan. Plans saved by other checklist files are in Plan setup.");

})();
</script>
</body>
