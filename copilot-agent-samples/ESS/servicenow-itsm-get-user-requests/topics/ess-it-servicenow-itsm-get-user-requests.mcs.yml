kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: RequestState
    description: |-
      RequestState indicates the state of the requests the user wants to fetch. For active, open and pending requests, RequestState value will be 'active'. Only for closed/completed requests, RequestState value will be 'inactive'. If not sure of the state or if the user is requesting all requests, RequestState will be 'all'.
      Examples:
      query - "List of my open requests"; RequestState value - "active"
      query - "My pending requests"; RequestState value - "active"
      query - "List of my requests"; RequestState - "all"
      query - "My completed requests"; RequestState value - "inactive"
      query - "My closed requests"; RequestState value - "inactive"
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDescription: |-
  This tool retrieves the list of service catalog requests (REQ numbers) for the user.

  Use this tool when a user asks about their requests, service requests, catalog requests, REQ items, or items they requested — NOT for incident tickets (INC), IT support tickets, helpdesk tickets, or support cases. If the user says "requests" without saying ticket, incident, INC, support, or helpdesk, treat it as a service catalog request and use this tool. Use ServiceNow-ITSM-Get-User-Tickets only for incidents or support tickets.

  Example queries:
  * "Show me my service requests"
  * "What requests do I have open?"
  * "My pending catalog requests"
  * "List my completed requests"
  * "What did I request recently?"
  * "Show my REQ items"

  Use these instructions to respond:
  1. Use the 'ServiceNowData' variable to answer the user's question.
  2. If no requests are found, tell the user.
  3. If requests are found, note they are sorted by most recently updated.
  4. Display them in a numbered list in the format:
  `**[{RequestNumber}]({ServiceNowPortalBaseURI}?id=ticket&table=sc_request&sys_id={SysId})**: {ShortDescription} ({State})`.
  5. Let the user know you can provide more details on any specific request.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - show all my requests
      - list all my requests
      - show my requests
      - list my requests
      - show me my service requests
      - list my service requests
      - what requests do I have open
      - show my open requests
      - my pending catalog requests
      - list my completed requests
      - what did I request recently
      - show my REQ items

  actions:
    - kind: ConditionGroup
      id: conditionGroup_requestState
      conditions:
        - id: conditionItem_allRequests
          condition: =Topic.RequestState = "all" || IsBlank(Topic.RequestState)
          displayName: List all requests
          actions:
            - kind: BeginDialog
              id: callSystemGetAllRequests
              input:
                binding:
                  IsActive: =Blank()
                  UserIdentifier: =Coalesce(Global.ESS_UserContext_UPN, System.User.PrincipalName)

              dialog: msdyn_copilotforemployeeselfserviceit.topic.ess-it-servicenow-itsm-system-get-user-requests
              output:
                binding:
                  ServiceNowData: Topic.ServiceNowData

      elseActions:
        - kind: SetVariable
          id: setIsActive
          variable: Topic.IsActive
          value: =If(Topic.RequestState = "active", true, false)

        - kind: BeginDialog
          id: callSystemGetFilteredRequests
          input:
            binding:
              IsActive: =Topic.IsActive
              UserIdentifier: =Coalesce(Global.ESS_UserContext_UPN, System.User.PrincipalName)

          dialog: msdyn_copilotforemployeeselfserviceit.topic.ess-it-servicenow-itsm-system-get-user-requests
          output:
            binding:
              ServiceNowData: Topic.ServiceNowData

inputType:
  properties:
    RequestState:
      displayName: RequestState
      description: |-
        RequestState indicates the state of the requests the user wants to fetch. For active, open and pending requests, RequestState value will be 'active'. Only for closed/completed requests, RequestState value will be 'inactive'. If not sure of the state or if the user is requesting all requests, RequestState will be 'all'.
      type: String
      examples:

outputType:
  properties:
    ServiceNowData:
      displayName: ServiceNowData
      description: List of service catalog requests returned from ServiceNow.
      type: String
      examples:
