<text x="86" y="125" class="a-title">Built-in platform agents</text>
<text class="a-sub"><tspan x="58" y="151">Agent Builder (declarative), Copilot</tspan><tspan x="58" dy="15">Studio, Azure AI Foundry &amp; integrated</tspan><tspan x="58" dy="15">partners. Built-in registration where</tspan><tspan x="58" dy="15">the platform supports it.</tspan></text></a>
<a href="#lanes"><title>Go to section 01 — Lifecycle overview</title>
<rect class="d-box a-boxhit" x="40" y="230" width="300" height="104" rx="7"/>
<circle cx="64" cy="254" r="11" fill="var(--cp-accent-tint)" stroke="var(--cp-accent)"/><text x="64" y="258" text-anchor="middle" class="a-num">2</text>
<text x="86" y="259" class="a-title">Manifest ZIP upload</text>
<text class="a-sub"><tspan x="58" y="285">Catalog publication route. Not code</tspan><tspan x="58" dy="15">hosting, not a universal registration</tspan><tspan x="58" dy="15">bypass.</tspan></text></a>
<a href="#caveats"><title>Go to section 10 — Caveats &amp; conflicts</title>
<rect class="d-box-prev a-boxhit" x="40" y="348" width="300" height="120" rx="7"/>
