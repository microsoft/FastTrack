name: Content Spring Cleaning

# Surfaces stale content for human review once a month. It does NOT delete or change
# anything automatically — it opens/updates a single tracking issue listing resources
# whose README `updated` date is over 2 years old, so a maintainer can decide whether to
# refresh them or set `status: archived`.

on:
  schedule:
    # 07:00 UTC on the 1st of every month
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "Age in days after which content is flagged as stale"
        required: false
        default: "730"

permissions:
  contents: read
  issues: write

concurrency:
  group: content-spring-cleaning
  cancel-in-progress: false

jobs:
  scan-stale-content:
    if: github.repository == 'microsoft/FastTrack'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for stale content and open review issue
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_DAYS: ${{ github.event.inputs.threshold_days || '730' }}
        run: |
          set -euo pipefail

          # The catalog already records each resource's last real update in its README front
          # matter (`updated`). Git history is not a reliable age signal because bulk commits
          # (metadata passes, renames) touch everything, so use the catalog instead.
          NOW=$(date -u +%s)
          THRESHOLD_SECS=$(( THRESHOLD_DAYS * 86400 ))
          REPORT_FILE=$(mktemp)
          STALE_COUNT=0

          while IFS=$'\t' read -r source updated; do
            [ -n "$updated" ] || continue
            updated_secs=$(date -u -d "$updated" +%s)
            if [ "$(( NOW - updated_secs ))" -gt "$THRESHOLD_SECS" ]; then
              age_days=$(( (NOW - updated_secs) / 86400 ))
              years=$(awk "BEGIN { printf \"%.1f\", $age_days/365.25 }")
              printf '| \`%s\` | %s | %sy |\n' "${source%/README.md}" "$updated" "$years" >> "$REPORT_FILE"
              STALE_COUNT=$((STALE_COUNT + 1))
            fi
          done < <(jq -r '.resources[] | select(.status != "archived") | [.source, .updated] | @tsv' catalog.json)

          echo "Found $STALE_COUNT stale item(s) older than ${THRESHOLD_DAYS} days."

          LABEL="content-spring-cleaning"
          gh label create "$LABEL" --color "0e8a16" \
            --description "Monthly automated stale-content review" 2>/dev/null || true

          existing=$(gh issue list --label "$LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [ "$STALE_COUNT" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" \
                --body "✅ $(date -u +%Y-%m-%d): monthly scan found **no** content older than ${THRESHOLD_DAYS} days. Nice and fresh."
            fi
            echo "Nothing stale — done."
            exit 0
          fi

          # Sort by age (years) descending for readability
          SORTED=$(sort -t'|' -k4 -rn "$REPORT_FILE")

          BODY=$(cat <<EOF
          ## 🧹 Monthly content spring-cleaning report

          Scan date: **$(date -u +%Y-%m-%d)** · Threshold: **${THRESHOLD_DAYS} days** · Flagged: **${STALE_COUNT}**

          These resources have a README \`updated\` date older than the threshold and are
          candidates for a refresh or for archiving.
          This is a **review list, not an automatic action** — a maintainer decides.

          | Resource | Last updated | Age |
          | --- | --- | --- |
          ${SORTED}

          ### Suggested triage
          - **Refresh** if still relevant → test it, update the resource, and bump \`version\` and \`updated\` in its README front matter.
          - **Archive** if obsolete → set \`status: archived\` in the front matter and add a notice saying what to use instead. The resource leaves the default catalog view, and its folder and links keep working.
          - Re-run anytime: \`gh workflow run content-spring-cleaning.yml --repo ${GITHUB_REPOSITORY}\`.

          _Opened automatically by the Content Spring Cleaning workflow. Reused monthly while the \`${LABEL}\` label stays open._
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY"
            gh issue comment "$existing" \
              --body "🔄 Refreshed $(date -u +%Y-%m-%d): ${STALE_COUNT} item(s) currently flagged."
            echo "Updated issue #$existing"
          else
            gh issue create \
              --title "🧹 Content spring-cleaning: ${STALE_COUNT} stale item(s) to review" \
              --body "$BODY" --label "$LABEL"
            echo "Opened new spring-cleaning issue"
          fi
