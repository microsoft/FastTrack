<rect class="d-tag-box" x="252" y="356" width="64" height="15" rx="3"/><text x="284" y="367" text-anchor="middle" class="d-tag">PREVIEW</text>
<text x="86" y="377" class="a-title">External registry sync</text>
<text class="a-sub"><tspan x="58" y="403">Metadata discovery imports (e.g.</tspan><tspan x="58" dy="15">Vertex AI, Bedrock). Metadata only</tspan><tspan x="58" dy="15">— no auto-instrumentation, identity</tspan><tspan x="58" dy="15">or runtime integration.</tspan></text></a>
<a href="#sdk"><title>Go to section 05 — SDKs, tooling &amp; the a365 CLI</title>
<rect class="d-box a-boxhit" x="40" y="482" width="300" height="126" rx="7"/>
<circle cx="64" cy="506" r="11" fill="var(--cp-accent-tint)" stroke="var(--cp-accent)"/><text x="64" y="510" text-anchor="middle" class="a-num">4</text>
<text x="86" y="511" class="a-title">Custom-coded agents</text>
<text class="a-sub"><tspan x="58" y="537">Built on the M365 Agents SDK, Agent</tspan><tspan x="58" dy="15">Framework or other runtimes. Wired in</tspan><tspan x="58" dy="15">and registered through the Agent 365</tspan><tspan x="58" dy="15">SDK / CLI.</tspan></text></a>
<rect class="a-gw" x="462" y="96" width="326" height="524" rx="9"/>
<a href="#lanes"><title>Go to section 01 — Lifecycle overview</title>
<rect class="d-box a-boxhit" x="478" y="108" width="300" height="96" rx="7"/>
<text x="498" y="136" class="a-title">Platform-managed integration</text>
<text class="a-sub"><tspan x="498" y="158">Built-in platforms register where the</tspan><tspan x="498" dy="15">platform supports it — no Agent 365</tspan><tspan x="498" dy="15">SDK needed for inventory.</tspan></text></a>
<a href="#lanes"><title>Go to section 01 — Lifecycle overview</title>
<rect class="d-box a-boxhit" x="478" y="234" width="300" height="96" rx="7"/>
<text x="498" y="262" class="a-title">Admin upload / approval</text>
<text class="a-sub"><tspan x="498" y="284">Manifest ZIP enters the org catalog.</tspan><tspan x="498" dy="15">Catalog availability is separate from</tspan><tspan x="498" dy="15">code hosting.</tspan></text></a>
<a href="#caveats"><title>Go to section 10 — Caveats &amp; conflicts</title>
<rect class="d-box-prev a-boxhit" x="478" y="360" width="300" height="96" rx="7"/>
<rect class="d-tag-box" x="688" y="368" width="64" height="15" rx="3"/><text x="720" y="379" text-anchor="middle" class="d-tag">PREVIEW</text>
<text x="498" y="388" class="a-title">Connected-platform sync</text>
<text class="a-sub"><tspan x="498" y="410">Imports metadata from external</tspan><tspan x="498" dy="15">registries. Metadata only — no</tspan><tspan x="498" dy="15">identity or runtime wiring.</tspan></text></a>
<a href="#sdk"><title>Go to section 05 — SDKs, tooling &amp; the a365 CLI</title>
<rect class="d-box a-boxhit" x="478" y="489" width="300" height="112" rx="7"/>
<text x="498" y="517" class="a-title">Agent 365 SDK / CLI + Agent ID</text>
<text class="a-sub"><tspan x="498" y="541">Custom integration. Registers the agent</tspan><tspan x="498" dy="15">and derives a per-agent Entra Agent ID</tspan><tspan x="498" dy="15">via blueprint auth &#8594; token exchange.</tspan><tspan x="498" dy="15">Optional Agent user (Frontier preview).</tspan></text></a>
<rect class="a-hub" x="822" y="96" width="388" height="560" rx="10"/>
<text x="844" y="132" class="a-hub-title">Agent 365 registry &amp; control plane</text>
<text class="a-hub-sub"><tspan x="844" y="156">Unified inventory hub. Metadata &amp;</tspan><tspan x="844" dy="15">governance only — never hosting or runtime.</tspan></text>
<a href="#lanes"><title>Go to section 01 — Lifecycle overview</title>
<rect class="a-hub-chip a-boxhit" x="844" y="196" width="344" height="86" rx="6"/>
<text x="864" y="224" class="a-chip-t">Registry record</text>
<text class="a-chip-s"><tspan x="864" y="246">Ownership · source · status metadata.</tspan><tspan x="864" dy="15">Metadata record; not publication or deployment.</tspan></text></a>
<a href="#endpoints"><title>Go to section 09 — Representative endpoint catalog</title>
<rect class="a-hub-chip a-boxhit" x="844" y="298" width="344" height="86" rx="6"/>
<text x="864" y="326" class="a-chip-t">Package / organizational catalog</text>
<text class="a-chip-s"><tspan x="864" y="348">Publishable app package &amp; catalog entry.</tspan><tspan x="864" dy="15">Upload, approval &amp; install are separate steps.</tspan></text></a>
<a href="#identity"><title>Go to section 03 — Identity objects &amp; relationships</title>
<rect class="a-hub-chip a-boxhit" x="844" y="400" width="344" height="86" rx="6"/>
<text x="864" y="428" class="a-chip-t">Identity blueprint reference</text>
<text class="a-chip-s"><tspan x="864" y="450">Points to the Entra Agent ID object —</tspan><tspan x="864" dy="15">the record does not store the credential.</tspan></text></a>
<line x1="844" y1="512" x2="1188" y2="512" class="a-hubdiv"/>
<text class="a-hub-sub"><tspan x="844" y="536">Distinct lifecycle objects, not one database row.</tspan><tspan x="844" dy="16">Publish / install / block, identity disable, stop</tspan><tspan x="844" dy="16">compute and delete are independent. Do not</tspan><tspan x="844" dy="16">assume cross-object deletion cascades.</tspan></text>
<a href="#admin"><title>Go to section 08 — Administration &amp; action semantics</title>
<rect class="d-box-accent a-boxhit" x="1262" y="118" width="300" height="112" rx="7"/>
<text x="1282" y="146" class="a-title">Registry UI + Microsoft Graph</text>
<text class="a-sub"><tspan x="1282" y="172">Inventory &amp; governance surface: browse,</tspan><tspan x="1282" dy="15">publish, install, block. Graph covers</tspan><tspan x="1282" dy="15">inventory plus selected governance actions.</tspan></text></a>
<a href="#identity"><title>Go to section 03 — Identity objects &amp; relationships</title>
<rect class="d-box-accent a-boxhit" x="1262" y="248" width="300" height="104" rx="7"/>
<text x="1282" y="276" class="a-title">Microsoft Entra</text>
<text class="a-sub"><tspan x="1282" y="302">Agent identity controls. Disabling an</tspan><tspan x="1282" dy="15">Agent ID blocks sign-in but does not</tspan><tspan x="1282" dy="15">delete the record or the compute.</tspan></text></a>
<a href="#telemetry"><title>Go to section 07 — Observability &amp; telemetry</title>
<rect class="d-box-accent a-boxhit" x="1262" y="370" width="300" height="104" rx="7"/>
<text x="1282" y="398" class="a-title">Microsoft Defender &amp; Purview</text>
<text class="a-sub"><tspan x="1282" y="424">Security telemetry &amp; compliance</tspan><tspan x="1282" dy="15">signals for governed agents.</tspan></text></a>
<a href="#admin"><title>Go to section 08 — Administration &amp; action semantics</title>
<rect class="d-box-soft a-boxhit" x="1262" y="492" width="300" height="164" rx="7"/>
<text x="1282" y="520" class="a-title">Independent operations</text>
<text class="a-sub"><tspan x="1282" y="546">&#8226; publish / install / block</tspan><tspan x="1282" dy="17">&#8226; identity disable</tspan><tspan x="1282" dy="17">&#8226; stop compute</tspan><tspan x="1282" dy="17">&#8226; delete record</tspan></text>
<text x="1282" y="642" class="a-edge">No automatic cascade between them.</text></a>
<path d="M986 656 L986 700" class="d-conn-accent" marker-end="url(#aarwA)" stroke-dasharray="5 3"/>
<rect class="a-edgebg" x="928" y="668" width="52" height="16" rx="3"/><text x="954" y="680" text-anchor="middle" class="a-edge">governs</text>
<path d="M1050 700 L1050 656" class="d-conn-accent" marker-end="url(#aarwA)"/>
<rect class="a-edgebg" x="1056" y="668" width="60" height="16" rx="3"/><text x="1086" y="680" text-anchor="middle" class="a-edge">telemetry</text>
<rect class="d-lane-bg" x="40" y="700" width="1522" height="320" rx="9"/>
<text x="64" y="732" class="a-lane">Runtime plane</text>
<text class="a-sub"><tspan x="64" y="756">Agents run on their own platform, Azure or partner host. Agent 365 governs; it does not execute code.</tspan></text>
<path d="M522 872 L574 872" class="d-conn" marker-end="url(#aarw)"/>
<rect class="a-edgebg" x="512" y="844" width="74" height="16" rx="3"/><text x="549" y="856" text-anchor="middle" class="a-edge">tool calls</text>
<path d="M1022 872 L1074 872" class="d-conn" marker-end="url(#aarw)"/>
<a href="#lanes"><title>Go to section 02 — Per-class lifecycle detail</title>
<rect class="d-box-soft a-boxhit" x="80" y="792" width="442" height="164" rx="7"/>
<text x="102" y="822" class="a-title">Agent runtime host</text>
<text class="a-sub"><tspan x="102" y="848">Platform-, Azure- or partner-hosted compute —</tspan><tspan x="102" dy="15">where the agent&#39;s code actually executes. The</tspan><tspan x="102" dy="15">registry record and identity are separate from</tspan><tspan x="102" dy="15">this host.</tspan></text></a>
<a href="#mcp"><title>Go to section 06 — Governed MCP tooling</title>
<rect class="d-box-prev a-boxhit" x="574" y="792" width="446" height="164" rx="7"/>
<rect class="d-tag-box" x="930" y="800" width="64" height="15" rx="3"/><text x="962" y="811" text-anchor="middle" class="d-tag">PREVIEW</text>
<text x="596" y="822" class="a-title">Governed MCP tools + WorkIQ</text>
<text class="a-sub"><tspan x="596" y="848">Policy-checked tool calls under the agent&#39;s</tspan><tspan x="596" dy="15">delegated user context — not autonomous</tspan><tspan x="596" dy="15">service-to-service. Registration alone does</tspan><tspan x="596" dy="15">not activate every capability.</tspan></text></a>
<a href="#telemetry"><title>Go to section 07 — Observability &amp; telemetry</title>
<rect class="d-box-soft a-boxhit" x="1072" y="792" width="446" height="164" rx="7"/>
<text x="1094" y="822" class="a-title">Downstream Microsoft 365 services</text>
<text class="a-sub"><tspan x="1094" y="848">Graph, mail, files and more — reached only</tspan><tspan x="1094" dy="15">under governance. Activity emits telemetry</tspan><tspan x="1094" dy="15">that surfaces back in the control plane and</tspan><tspan x="1094" dy="15">in Defender &amp; Purview.</tspan></text></a>
</svg>